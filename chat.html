<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenchats - Chat</title>
<style>
  :root{
    --bg:#0B0D12; --surface:#161A22; --surface-2:#1E232D;
    --accent:#6C5CE7; --accent-warm:#F2B84B; --text:#ECEDEF; --muted:#8B939F;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  .app{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- Daftar Chat ---------- */
  #listView{ display:flex; flex-direction:column; height:100%; }
  header.list-header{ padding:18px; border-bottom:1px solid rgba(255,255,255,0.06); }
  header.list-header h1{ font-size:1.2rem; }
  header.list-header h1 span{ color:var(--accent-warm); }

  .chat-list{ flex:1; overflow-y:auto; padding:6px 10px; }
  .empty-hint{ text-align:center; color:var(--muted); font-size:0.85rem; margin-top:50px; padding:0 20px; line-height:1.5; }

  .chat-item{
    display:flex; align-items:center; gap:12px;
    padding:12px 10px; border-radius:12px; cursor:pointer;
    transition:background 0.15s ease;
  }
  .chat-item:hover, .chat-item:active{ background:var(--surface); }
  .avatar{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), #A29BFE);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff;
  }
  .c-info{ flex:1; min-width:0; }
  .c-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .c-name{ font-weight:600; font-size:0.95rem; }
  .c-time{ font-size:0.7rem; color:var(--muted); flex-shrink:0; }
  .c-preview{ font-size:0.82rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  nav.bottomnav{ display:flex; border-top:1px solid rgba(255,255,255,0.06); background:var(--surface); }
  nav.bottomnav a{ flex:1; text-align:center; padding:12px 0; color:var(--muted); text-decoration:none; font-size:0.78rem; }
  nav.bottomnav a.active{ color:var(--accent-warm); }
  nav.bottomnav .ic{ font-size:1.2rem; display:block; margin-bottom:2px; }

  /* ---------- Chat Room ---------- */
  #roomView{ display:none; flex-direction:column; height:100%; }
  header.room-header{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.06);
    background:var(--surface);
  }
  header.room-header .back{ font-size:1.3rem; cursor:pointer; color:var(--text); text-decoration:none; }
  header.room-header .rname{ font-weight:600; font-size:1rem; }

  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble{
    max-width:72%; padding:9px 13px; border-radius:16px; font-size:0.9rem;
    line-height:1.35; position:relative; word-wrap:break-word;
  }
  .bubble.me{
    align-self:flex-end; background:var(--accent); color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start; background:var(--surface-2); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .bubble .time{
    font-size:0.65rem; opacity:0.65; margin-top:4px; text-align:right;
  }

  form.compose{
    display:flex; gap:10px; padding:12px 14px;
    border-top:1px solid rgba(255,255,255,0.06); background:var(--surface);
  }
  form.compose input{
    flex:1; padding:11px 15px; border-radius:999px; border:1px solid rgba(255,255,255,0.08);
    background:var(--surface-2); color:var(--text); outline:none; font-size:0.9rem;
  }
  form.compose button{
    width:42px; height:42px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  form.compose button:hover{ background:#5A4BD6; }

  .music-toggle{
    position:fixed; z-index:50;
    top:14px; right:14px;
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(20,22,28,0.55);
    backdrop-filter:blur(6px);
    color:var(--text); font-size:1.05rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <!-- DAFTAR CHAT -->
  <div id="listView">
    <header class="list-header"><h1>Chat<span>.</span></h1></header>
    <div class="chat-list" id="chatList">
      <div class="empty-hint">Belum ada obrolan.<br>Cari user dulu buat mulai chat.</div>
    </div>
    <nav class="bottomnav">
      <a href="chat.html" class="active"><span class="ic">💬</span>Chat</a>
      <a href="search.html"><span class="ic">🔍</span>Cari</a>
      <a href="profile.html"><span class="ic">👤</span>Profil</a>
    </nav>
  </div>

  <!-- CHAT ROOM -->
  <div id="roomView">
    <header class="room-header">
      <a href="chat.html" class="back">←</a>
      <div class="rname" id="roomName">...</div>
    </header>
    <div class="messages" id="messagesEl"></div>
    <form class="compose" id="composeForm">
      <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </div>

</div>

<button id="musicToggle" class="music-toggle" title="Musik">🔈</button>
<audio id="bgMusic" src="assets/bgmusic.mp3" loop></audio>

<script>
  (function(){
    const audio = document.getElementById('bgMusic');
    const btn = document.getElementById('musicToggle');
    const KEY = 'kenchats_music_on';

    function updateIcon(playing){ btn.textContent = playing ? '🔊' : '🔈'; }

    if (localStorage.getItem(KEY) === 'on'){
      audio.play().then(()=>updateIcon(true)).catch(()=>updateIcon(false));
    }

    btn.addEventListener('click', () => {
      if (audio.paused){
        audio.play().then(()=>{ localStorage.setItem(KEY,'on'); updateIcon(true); }).catch(()=>{});
      } else {
        audio.pause();
        localStorage.setItem(KEY,'off');
        updateIcon(false);
      }
    });
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, query, where, orderBy,
    onSnapshot, addDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
    authDomain: "nero-fa67c.firebaseapp.com",
    projectId: "nero-fa67c",
    storageBucket: "nero-fa67c.firebasestorage.app",
    messagingSenderId: "349005489687",
    appId: "1:349005489687:web:c27ce076b4f54da5275e52"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const chatIdParam = urlParams.get('chat');

  let myUid = null;

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    myUid = user.uid;
    if (chatIdParam) {
      showRoom(chatIdParam);
    } else {
      showList();
    }
  });

  function fmtTime(ts){
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  }

  /* ---------- DAFTAR CHAT ---------- */
  function showList(){
    document.getElementById('listView').style.display = 'flex';
    document.getElementById('roomView').style.display = 'none';

    const q = query(collection(db, 'chats'), where('participants', 'array-contains', myUid));
    onSnapshot(q, (snap) => {
      const chatListEl = document.getElementById('chatList');
      let items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));

      // urutkan terbaru di atas (client-side, hindari perlu composite index)
      items.sort((a,b) => {
        const ta = a.updatedAt?.toMillis ? a.updatedAt.toMillis() : 0;
        const tb = b.updatedAt?.toMillis ? b.updatedAt.toMillis() : 0;
        return tb - ta;
      });

      if (items.length === 0){
        chatListEl.innerHTML = '<div class="empty-hint">Belum ada obrolan.<br>Cari user dulu buat mulai chat.</div>';
        return;
      }

      chatListEl.innerHTML = '';
      items.forEach(c => {
        const otherUid = (c.participants || []).find(p => p !== myUid);
        const otherName = (c.participantNames && c.participantNames[otherUid]) || 'User';
        const row = document.createElement('div');
        row.className = 'chat-item';
        row.innerHTML = `
          <div class="avatar">${otherName.replace('@','').charAt(0).toUpperCase()}</div>
          <div class="c-info">
            <div class="c-top">
              <span class="c-name">${otherName}</span>
              <span class="c-time">${fmtTime(c.updatedAt)}</span>
            </div>
            <div class="c-preview">${c.lastMessage ? c.lastMessage : 'Belum ada pesan'}</div>
          </div>`;
        row.addEventListener('click', () => {
          window.location.href = 'chat.html?chat=' + c.id;
        });
        chatListEl.appendChild(row);
      });
    });
  }

  /* ---------- CHAT ROOM ---------- */
  function showRoom(chatId){
    document.getElementById('listView').style.display = 'none';
    document.getElementById('roomView').style.display = 'flex';

    getDoc(doc(db, 'chats', chatId)).then(snap => {
      if (!snap.exists()) return;
      const data = snap.data();
      const otherUid = (data.participants || []).find(p => p !== myUid);
      const otherName = (data.participantNames && data.participantNames[otherUid]) || 'User';
      document.getElementById('roomName').textContent = otherName;
    });

    const messagesEl = document.getElementById('messagesEl');
    const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'));
    onSnapshot(q, (snap) => {
      messagesEl.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + (m.senderId === myUid ? 'me' : 'them');
        bubble.innerHTML = `${escapeHtml(m.text)}<div class="time">${fmtTime(m.timestamp)}</div>`;
        messagesEl.appendChild(bubble);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    const form = document.getElementById('composeForm');
    const input = document.getElementById('messageInput');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      await addDoc(collection(db, 'chats', chatId, 'messages'), {
        senderId: myUid,
        text: text,
        timestamp: serverTimestamp()
      });
      await updateDoc(doc(db, 'chats', chatId), {
        lastMessage: text,
        updatedAt: serverTimestamp()
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
