<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenchats - Cari User</title>
<style>
  :root{
    --bg:#0B0D12; --surface:#161A22; --surface-2:#1E232D;
    --accent:#6C5CE7; --accent-warm:#F2B84B; --text:#ECEDEF; --muted:#8B939F;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  .app{ display:flex; flex-direction:column; height:100vh; }
  header{
    padding:18px 18px 12px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  header h1{ font-size:1.2rem; margin-bottom:12px; }
  header h1 span{ color:var(--accent-warm); }
  .search-box{
    display:flex; gap:8px;
    background:var(--surface-2);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:10px 14px;
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-size:0.95rem;
  }
  .search-box input::placeholder{ color:var(--muted); }

  .results{ flex:1; overflow-y:auto; padding:8px 12px; }
  .hint{ text-align:center; color:var(--muted); font-size:0.85rem; margin-top:40px; padding:0 20px; }

  .user-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .user-row:hover, .user-row:active{ background:var(--surface); }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), #A29BFE);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; color:#fff; flex-shrink:0;
  }
  .u-info .uname{ font-weight:600; font-size:0.95rem; }
  .u-info .uemail{ font-size:0.78rem; color:var(--muted); }

  .loading{ text-align:center; color:var(--muted); font-size:0.85rem; margin-top:30px; }

  nav.bottomnav{
    display:flex; border-top:1px solid rgba(255,255,255,0.06);
    background:var(--surface);
  }
  nav.bottomnav a{
    flex:1; text-align:center; padding:12px 0;
    color:var(--muted); text-decoration:none; font-size:0.78rem;
  }
  nav.bottomnav a.active{ color:var(--accent-warm); }
  nav.bottomnav .ic{ font-size:1.2rem; display:block; margin-bottom:2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Cari User<span>.</span></h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ketik @username atau Kenchats ID">
    </div>
  </header>

  <div class="results" id="results">
    <div class="hint">Ketik @username atau Kenchats ID</div>
  </div>

  <nav class="bottomnav">
    <a href="chat.html"><span class="ic">💬</span>Chat</a>
    <a href="search.html" class="active"><span class="ic">🔍</span>Cari</a>
    <a href="profile.html"><span class="ic">👤</span>Profil</a>
  </nav>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, orderBy, limit, getDocs,
    doc, getDoc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
    authDomain: "nero-fa67c.firebaseapp.com",
    projectId: "nero-fa67c",
    storageBucket: "nero-fa67c.firebasestorage.app",
    messagingSenderId: "349005489687",
    appId: "1:349005489687:web:c27ce076b4f54da5275e52"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let myUid = null;
  let myUsername = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    myUid = user.uid;
    const snap = await getDoc(doc(db, 'users', myUid));
    myUsername = snap.exists() ? snap.data().username : (user.email || 'User');
  });

  function makeChatId(a, b){ return [a, b].sort().join('_'); }

  const resultsEl = document.getElementById('results');
  const input = document.getElementById('searchInput');
  let debounceTimer;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const term = input.value.trim();
    if (!term) {
      resultsEl.innerHTML = '<div class="hint">Ketik @username atau Kenchats ID</div>';
      return;
    }
    resultsEl.innerHTML = '<div class="loading">Mencari...</div>';
    debounceTimer = setTimeout(() => doSearch(term), 350);
  });

  async function doSearch(rawTerm){
    try{
      const isIdSearch = /^\d+$/.test(rawTerm);
      let items = [];

      if (isIdSearch){
        const q = query(collection(db, 'users'), where('kenchatsId', '==', rawTerm));
        const snap = await getDocs(q);
        snap.forEach(d => { if (d.id !== myUid) items.push({ uid: d.id, ...d.data() }); });
      } else {
        let term = rawTerm.toLowerCase();
        if (!term.startsWith('@')) term = '@' + term;
        const q = query(
          collection(db, 'users'),
          orderBy('username_lower'),
          where('username_lower', '>=', term),
          where('username_lower', '<=', term + '\uf8ff'),
          limit(20)
        );
        const snap = await getDocs(q);
        snap.forEach(d => { if (d.id !== myUid) items.push({ uid: d.id, ...d.data() }); });
      }

      if (items.length === 0){
        resultsEl.innerHTML = '<div class="hint">Gak ada user dengan @username atau ID itu</div>';
        return;
      }

      resultsEl.innerHTML = '';
      items.forEach(u => {
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <div class="avatar">${(u.username||'?').replace('@','').charAt(0).toUpperCase()}</div>
          <div class="u-info">
            <div class="uname">${u.username}</div>
            <div class="uemail">ID: ${u.kenchatsId || '-'}</div>
          </div>`;
        row.addEventListener('click', () => openChatWith(u.uid, u.username));
        resultsEl.appendChild(row);
      });
    } catch(err){
      resultsEl.innerHTML = `<div class="hint">Terjadi kesalahan: ${err.message}</div>`;
    }
  }

  async function openChatWith(otherUid, otherUsername){
    try{
      const chatId = makeChatId(myUid, otherUid);
      const chatRef = doc(db, 'chats', chatId);
      const existing = await getDoc(chatRef);
      if (!existing.exists()){
        await setDoc(chatRef, {
          participants: [myUid, otherUid],
          participantNames: { [myUid]: myUsername, [otherUid]: otherUsername },
          lastMessage: '',
          updatedAt: serverTimestamp()
        });
      }
      window.location.href = 'chat.html?chat=' + chatId;
    } catch(err){
      resultsEl.innerHTML = `<div class="hint">Gagal buka chat: ${err.message}</div>`;
    }
  }
</script>
</body>
</html>
